
name: Obtener Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  obtener_id:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getUpdates"

          with urllib.request.urlopen(url, timeout=20) as response:
              data = json.load(response)

          if not data.get("ok"):
              raise RuntimeError("Telegram no devolvió una respuesta válida")

          encontrados = []
          for update in data.get("result", []):
              msg = update.get("message", {})
              chat = msg.get("chat", {})
              if (chat.get("type") == "private"
                      and msg.get("text", "").strip().lower() == "hola"):
                  encontrados.append(chat.get("id"))

          if encontrados:
              print("TELEGRAM_CHAT_ID:", encontrados[-1])
          else:
              print("No se encontró el mensaje 'hola'.")
              print("Comprueba que lo enviaste al bot correcto.")
          PY
